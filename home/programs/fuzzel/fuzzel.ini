# Fuzzel — Shadcn / Zinc application launcher

[main]
font=JetBrainsMono Nerd Font:size=15
prompt="> "
placeholder=Search...
icon-theme=Papirus-Dark
fields=name,generic,comment,filename,categories
match-mode=fzf
filter-desktop=no
show-actions=no
terminal=foot
list-executables-in-path=no
lines=10
horizontal-pad=12
vertical-pad=12
inner-pad=6
x-margin=12
y-margin=12

[colors]
background=0a0a0cff
text=fafafaff
prompt=71717aff
placeholder=71717aff
input=fafafaff
match=fafafaff
selection=fafafaff
selection-text=0a0a0cff
selection-match=0a0a0cff
border=27272aff

[border]
width=1
radius=8
selection-radius=6
